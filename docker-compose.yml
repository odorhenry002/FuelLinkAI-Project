version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fuellink_postgres
    environment:
      POSTGRES_USER: fuellink_user
      POSTGRES_PASSWORD: fuellink_password
      POSTGRES_DB: fuellink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fuellink_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuellink_user -d fuellink_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Optional, for caching & sessions)
  redis:
    image: redis:7-alpine
    container_name: fuellink_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fuellink_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuellink_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fuellink_user:fuellink_password@postgres:5432/fuellink_db
      REDIS_URL: redis://redis:6379
      DEBUG: "True"
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - fuellink_network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuellink_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - fuellink_network

volumes:
  postgres_data:
  redis_data:

networks:
  fuellink_network:
    driver: bridge
